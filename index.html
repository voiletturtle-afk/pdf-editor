<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDFKit — Free In-Browser PDF Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:        #f0f4f8;
      --surface:   #ffffff;
      --border:    #e2e8f0;
      --border-md: #cbd5e1;
      --navy:      #0f172a;
      --accent:    #4f46e5;
      --accent-lt: #eef2ff;
      --accent-dk: #3730a3;
      --green:     #059669;
      --green-lt:  #d1fae5;
      --red:       #dc2626;
      --red-lt:    #fee2e2;
      --text:      #0f172a;
      --muted:     #64748b;
      --faint:     #94a3b8;
      --radius:    12px;
      --radius-lg: 18px;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
      --shadow:    0 4px 16px rgba(0,0,0,.10);
      --shadow-lg: 0 20px 50px rgba(0,0,0,.18);
      --font:      'Plus Jakarta Sans', system-ui, sans-serif;
      --mono:      'JetBrains Mono', 'Courier New', monospace;
      --t:         200ms cubic-bezier(.4,0,.2,1);
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }

    /* NAVBAR */
    .navbar {
      background: var(--navy); padding: 0 clamp(16px,4vw,48px);
      display: flex; align-items: center; justify-content: space-between;
      height: 60px; position: sticky; top: 0; z-index: 100;
      box-shadow: 0 1px 0 rgba(255,255,255,.07);
    }
    .nb-brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:#fff; font-weight:800; font-size:1.1rem; letter-spacing:-.02em; }
    .nb-logo { width:32px; height:32px; background:var(--accent); border-radius:8px; display:grid; place-items:center; }
    .nb-logo svg { width:17px; height:17px; stroke:#fff; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .nb-badge { display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:4px 12px; font-size:.73rem; color:#a5f3fc; font-weight:700; letter-spacing:.04em; }
    .nb-badge svg { width:11px; height:11px; stroke:#a5f3fc; fill:none; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }

    /* HERO */
    .hero { background:var(--navy); padding:clamp(40px,6vw,72px) clamp(16px,4vw,48px) clamp(52px,8vw,96px); text-align:center; position:relative; overflow:hidden; }
    .hero::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 70% 70% at 50% 130%, rgba(79,70,229,.32) 0%, transparent 65%); pointer-events:none; }
    .hero-pill { display:inline-flex; align-items:center; gap:6px; background:rgba(79,70,229,.22); border:1px solid rgba(99,102,241,.35); border-radius:20px; padding:4px 14px; font-size:.73rem; font-weight:700; color:#a5b4fc; letter-spacing:.08em; text-transform:uppercase; margin-bottom:22px; }
    .hero h1 { font-size:clamp(1.9rem,5vw,3.2rem); font-weight:800; color:#fff; letter-spacing:-.03em; line-height:1.15; margin-bottom:14px; }
    .hero h1 em { color:#818cf8; font-style:normal; }
    .hero p { font-size:clamp(.9rem,2vw,1.1rem); color:#94a3b8; max-width:520px; margin:0 auto; }

    /* MAIN */
    .main { max-width:1140px; margin:0 auto; padding:clamp(28px,5vw,56px) clamp(16px,4vw,28px) 72px; }
    .section-label { font-size:.7rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); margin-bottom:18px; }

    /* TOOL GRID */
    .tool-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
    .tool-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:22px 20px; cursor:pointer; transition:transform var(--t),box-shadow var(--t),border-color var(--t); position:relative; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow-sm); }
    .tool-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); border-color:var(--accent); }
    .tool-card:active { transform:translateY(0); }
    .tool-card.is-new { border-color:#a5b4fc; }
    .tool-card.is-new::after { content:'NEW'; position:absolute; top:13px; right:13px; background:var(--accent); color:#fff; font-size:.58rem; font-weight:800; letter-spacing:.1em; padding:2px 8px; border-radius:20px; }
    .card-icon { width:42px; height:42px; border-radius:10px; background:var(--accent-lt); display:grid; place-items:center; flex-shrink:0; }
    .card-icon svg { width:21px; height:21px; stroke:var(--accent); stroke-width:1.75; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .card-body h3 { font-size:.95rem; font-weight:700; color:var(--text); margin-bottom:3px; }
    .card-body p { font-size:.79rem; color:var(--muted); line-height:1.5; }

    /* MODAL */
    .modal-backdrop { display:none; position:fixed; inset:0; background:rgba(15,23,42,.6); backdrop-filter:blur(5px); z-index:200; align-items:center; justify-content:center; padding:16px; }
    .modal-backdrop.open { display:flex; animation:fadeIn 180ms ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    @keyframes slideUp { from{opacity:0;transform:translateY(22px) scale(.985)} to{opacity:1;transform:none} }
    .modal { background:var(--surface); border-radius:var(--radius-lg); width:100%; max-width:700px; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-lg); animation:slideUp 230ms cubic-bezier(.34,1.25,.64,1); }
    .modal-head { display:flex; align-items:center; gap:13px; padding:20px 22px 17px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--surface); z-index:10; }
    .mh-icon { width:36px; height:36px; border-radius:9px; background:var(--accent-lt); display:grid; place-items:center; flex-shrink:0; }
    .mh-icon svg { width:19px; height:19px; stroke:var(--accent); stroke-width:1.9; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .modal-title { font-size:1.05rem; font-weight:700; flex:1; }
    .modal-x { width:30px; height:30px; border:none; background:var(--bg); border-radius:7px; cursor:pointer; display:grid; place-items:center; color:var(--muted); transition:background var(--t),color var(--t); }
    .modal-x:hover { background:var(--border); color:var(--text); }
    .modal-x svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2.5; stroke-linecap:round; }
    .modal-body { padding:22px; }

    /* DROP ZONE */
    .drop-zone { border:2px dashed var(--border-md); border-radius:var(--radius); padding:32px 20px; text-align:center; cursor:pointer; transition:border-color var(--t),background var(--t); background:var(--bg); position:relative; margin-bottom:18px; }
    .drop-zone:hover, .drop-zone.dragover { border-color:var(--accent); background:var(--accent-lt); }
    .drop-zone input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%; }
    .dz-icon { width:46px; height:46px; background:#e0e7ff; border-radius:12px; display:grid; place-items:center; margin:0 auto 12px; }
    .dz-icon svg { width:23px; height:23px; stroke:var(--accent); fill:none; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
    .drop-zone strong { display:block; font-size:.92rem; font-weight:700; color:var(--text); margin-bottom:3px; }
    .drop-zone span { font-size:.78rem; color:var(--muted); }
    .file-chosen { display:none; align-items:center; justify-content:center; gap:7px; font-size:.85rem; font-weight:600; color:var(--accent); margin-top:10px; }

    /* CONTROLS */
    .ctrl-row { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-bottom:18px; }
    .ctrl-grp { display:flex; flex-direction:column; gap:5px; }
    .ctrl-grp label { font-size:.7rem; font-weight:700; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; }
    .ctrl-grp select, .ctrl-grp input[type="range"] { padding:8px 12px; border:1px solid var(--border-md); border-radius:8px; font-size:.88rem; font-family:var(--font); color:var(--text); background:var(--surface); outline:none; transition:border-color var(--t); }
    .ctrl-grp select:focus, .ctrl-grp input:focus { border-color:var(--accent); }
    .ctrl-grp input[type="range"] { padding:3px 0; width:130px; accent-color:var(--accent); cursor:pointer; }
    .ctrl-val { font-size:.8rem; font-weight:700; color:var(--accent); padding-bottom:2px; }

    /* BUTTONS */
    .btn { display:inline-flex; align-items:center; gap:7px; padding:10px 18px; border:none; border-radius:8px; font-size:.85rem; font-weight:700; font-family:var(--font); cursor:pointer; transition:all var(--t); text-decoration:none; white-space:nowrap; }
    .btn svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-primary:hover { background:var(--accent-dk); }
    .btn-success { background:var(--green); color:#fff; }
    .btn-success:hover { background:#047857; }
    .btn-ghost { background:var(--bg); color:var(--text); border:1px solid var(--border-md); }
    .btn-ghost:hover { background:var(--border); }
    .btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }

    /* STATUS */
    .status { display:flex; align-items:flex-start; gap:11px; padding:13px 15px; border-radius:var(--radius); font-size:.85rem; line-height:1.5; margin-bottom:14px; }
    .status svg { width:17px; height:17px; fill:none; stroke-width:2; flex-shrink:0; margin-top:1px; stroke-linecap:round; stroke-linejoin:round; }
    .s-info    { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; }
    .s-info svg { stroke:#3b82f6; }
    .s-success { background:var(--green-lt); color:#065f46; border:1px solid #6ee7b7; }
    .s-success svg { stroke:var(--green); }
    .s-error   { background:var(--red-lt); color:#991b1b; border:1px solid #fca5a5; }
    .s-error svg { stroke:var(--red); }

    /* SPINNER */
    .spin-wrap { display:flex; flex-direction:column; align-items:center; gap:14px; padding:36px 20px; color:var(--muted); font-size:.85rem; }
    .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .65s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    /* PROGRESS */
    .prog-wrap { background:var(--border); border-radius:6px; height:5px; overflow:hidden; margin:9px 0 5px; }
    .prog-bar { height:100%; background:linear-gradient(90deg,var(--accent),#818cf8); width:0%; transition:width .28s ease; border-radius:6px; }
    .prog-lbl { font-size:.75rem; color:var(--muted); }

    /* FILE LIST */
    .file-list { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
    .file-item { display:flex; align-items:center; gap:9px; padding:9px 13px; background:var(--bg); border:1px solid var(--border); border-radius:8px; font-size:.82rem; font-weight:500; }
    .file-item svg { width:14px; height:14px; stroke:var(--accent); fill:none; flex-shrink:0; stroke-linecap:round; stroke-linejoin:round; }
    .file-num { font-size:.68rem; font-weight:700; color:var(--muted); background:var(--border); border-radius:4px; padding:1px 5px; }

    /* PAGE GRID */
    .page-grid { display:flex; flex-wrap:wrap; gap:7px; margin:12px 0; }
    .page-btn { width:38px; height:38px; border:1.5px solid var(--border-md); background:var(--surface); border-radius:7px; font-size:.8rem; font-weight:700; cursor:pointer; transition:all var(--t); color:var(--muted); font-family:var(--font); }
    .page-btn:hover { border-color:var(--accent); color:var(--accent); }
    .page-btn.selected { background:var(--accent); border-color:var(--accent); color:#fff; }

    /* PREVIEW */
    .preview-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-top:14px; }
    .preview-card { border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:var(--surface); box-shadow:var(--shadow-sm); }
    .preview-card img { width:100%; display:block; }
    .preview-foot { padding:9px; display:flex; justify-content:center; }

    /* OCR BOX */
    .ocr-box { width:100%; min-height:240px; padding:15px; border:1px solid var(--border-md); border-radius:var(--radius); font-family:var(--mono); font-size:.82rem; line-height:1.75; resize:vertical; background:#fafafa; color:var(--text); outline:none; transition:border-color var(--t); }
    .ocr-box:focus { border-color:var(--accent); }

    /* INFO */
    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    @media(max-width:480px){ .info-grid{grid-template-columns:1fr} }
    .info-item { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:11px 13px; }
    .info-item dt { font-size:.68rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.07em; margin-bottom:2px; }
    .info-item dd { font-size:.88rem; font-weight:600; word-break:break-all; }

    /* FOOTER */
    .footer { text-align:center; padding:22px 16px; font-size:.75rem; color:var(--faint); border-top:1px solid var(--border); }

    @media(max-width:600px){
      .modal-body { padding:16px; }
      .ctrl-row { gap:10px; }
      .tool-grid { grid-template-columns:1fr 1fr; }
    }
    @media(max-width:380px){ .tool-grid { grid-template-columns:1fr; } }
  </style>
</head>

      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
    </div>
    PDFKit
  </a>
  <div class="nb-badge">

  </div>

<!-- HERO -->
<section class="hero">
  <div class="hero-pill">
    <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="#a5b4fc" stroke-width="2.2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    Free &middot; Private &middot; No Sign-up
  </div>
  <h1>Your PDF, your <em>browser.</em></h1>

<!-- MAIN -->
<main class="main">
  <p class="section-label">Choose a tool to get started</p>
  <div class="tool-grid" id="toolGrid"></div>
</main>

<!-- MODAL -->
<div class="modal-backdrop" id="backdrop" role="dialog" aria-modal="true">
  <div class="modal" id="modal">
    <div class="modal-head">
      <div class="mh-icon" id="mhIcon"></div>
      <h2 class="modal-title" id="mhTitle"></h2>
      <button class="modal-x" id="modalX" aria-label="Close">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer class="footer">PDFKit &mdash; All processing is local. Your files never leave your device.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
/* ── PDF.js worker ── */
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ── Inline SVG icons ── */
const I = {
  file:     `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>`,
  image:    `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21,15 16,10 5,21"/></svg>`,
  compress: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,14 10,14 10,20"/><polyline points="20,10 14,10 14,4"/><line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/></svg>`,
  merge:    `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>`,
  split:    `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><path d="M8 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3"/><line x1="12" y1="3" x2="12" y2="21"/></svg>`,
  rotate:   `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`,
  info:     `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>`,
  ocr:      `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10,9 9,9 8,9"/></svg>`,
  upload:   `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16,16 12,12 8,16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>`,
  download: `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8,17 12,21 16,17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>`,
  copy:     `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`,
  check:    `<svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"/></svg>`,
  warn:     `<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
};

/* ── Tool definitions ── */
const TOOLS = [
  { id:'convert',  label:'PDF to Image',    desc:'Export pages as high-res PNG or JPEG',      icon:'image'    },
  { id:'compress', label:'Compress PDF',     desc:'Reduce file size without re-encoding',       icon:'compress' },
  { id:'merge',    label:'Merge PDFs',       desc:'Combine multiple PDFs into one file',        icon:'merge'    },
  { id:'split',    label:'Split PDF',        desc:'Extract specific pages into a new PDF',      icon:'split'    },
  { id:'rotate',   label:'Rotate Pages',     desc:'Rotate all pages 90°, 180° or 270°',        icon:'rotate'   },
  { id:'info',     label:'PDF Info',         desc:'Inspect metadata, page count & dimensions',  icon:'info'     },
  { id:'ocr',      label:'PDF to Text (OCR)', desc:'Extract text from scans. Supports Dhivehi/Thaana.', icon:'ocr', isNew:true },
];

/* ── Build grid ── */
const grid = document.getElementById('toolGrid');
TOOLS.forEach(t => {
  const card = document.createElement('div');
  card.className = 'tool-card' + (t.isNew ? ' is-new' : '');
  card.innerHTML = `<div class="card-icon">${I[t.icon]}</div><div class="card-body"><h3>${t.label}</h3><p>${t.desc}</p></div>`;
  card.addEventListener('click', () => openModal(t));
  grid.appendChild(card);
});

/* ── Modal ── */
let _splitDoc = null, _pdfFiles = [], _selectedPages = [], _rotateFile = null;

function openModal(tool) {
  document.getElementById('mhIcon').innerHTML  = I[tool.icon];
  document.getElementById('mhTitle').textContent = tool.label;
  document.getElementById('modalBody').innerHTML = toolHTML(tool.id);
  document.getElementById('backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
  _selectedPages = []; _pdfFiles = []; _splitDoc = null; _rotateFile = null;
  setTimeout(() => initTool(tool.id), 70);
}

function closeModal() {
  document.getElementById('backdrop').classList.remove('open');
  document.body.style.overflow = '';
  document.getElementById('modalBody').innerHTML = '';
}

document.getElementById('modalX').addEventListener('click', closeModal);
document.getElementById('backdrop').addEventListener('click', e => { if (e.target.id === 'backdrop') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── Helpers ── */
function dropZone(dzId, inputId, multi, cb) {
  const dz = document.getElementById(dzId);
  const inp = document.getElementById(inputId);
  if (!dz || !inp) return;
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('dragover'); cb(multi ? e.dataTransfer.files : [e.dataTransfer.files[0]]); });
  inp.addEventListener('change', e => cb(e.target.files));
}

function showChosen(dzId, files) {
  const el = document.querySelector(`#${dzId} .file-chosen`);
  if (!el || !files || !files.length) return;
  el.textContent = files.length === 1 ? `✓  ${files[0].name}` : `✓  ${files.length} files selected`;
  el.style.display = 'flex';
}

function status(type, msg) {
  const ic = { info: I.warn, success: I.check, error: I.warn };
  const cl = { info: 's-info', success: 's-success', error: 's-error' };
  return `<div class="status ${cl[type]}">${ic[type]}<span>${msg}</span></div>`;
}
function spinner(msg) { return `<div class="spin-wrap"><div class="spinner"></div><span>${msg}</span></div>`; }
function dlBtn(url, name, label) { return `<a href="${url}" download="${name}" class="btn btn-success">${I.download}${label}</a>`; }

/* ── Tool inits ── */
function initTool(id) {
  switch(id) {
    case 'convert':  initConvert();  break;
    case 'compress': initCompress(); break;
    case 'merge':    initMerge();    break;
    case 'split':    initSplit();    break;
    case 'rotate':   initRotate();   break;
    case 'info':     initInfo();     break;
    case 'ocr':      initOcr();      break;
  }
}

/* ── Convert ── */
function initConvert() {
  const scaleEl = document.getElementById('imgScale');
  const qualEl  = document.getElementById('imgQual');
  const scaleV  = document.getElementById('scaleVal');
  const qualV   = document.getElementById('qualVal');
  const DPI = {'1':'72','1.5':'108','2':'144','2.5':'180','3':'216','3.5':'252','4':'288'};
  scaleEl.addEventListener('input', () => { scaleV.textContent = `${scaleEl.value}× ≈ ${DPI[scaleEl.value]||Math.round(scaleEl.value*72)} DPI`; });
  qualEl.addEventListener('input',  () => { qualV.textContent  = qualEl.value + '%'; });

  dropZone('dz','pdfFile',false, async files => {
    const file = files[0]; if (!file) return;
    showChosen('dz', files);
    const out = document.getElementById('output');
    out.innerHTML = spinner('Rendering pages…');
    try {
      const pdf   = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      const fmt   = document.getElementById('imgFmt').value;
      const scale = parseFloat(scaleEl.value);
      const qual  = parseInt(qualEl.value) / 100;
      let html = '<div class="preview-grid">';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const vp   = page.getViewport({ scale });
        const cv   = document.createElement('canvas');
        cv.width = vp.width; cv.height = vp.height;
        await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        const src = cv.toDataURL(`image/${fmt}`, qual);
        html += `<div class="preview-card"><img src="${src}" alt="Page ${i}"><div class="preview-foot"><a href="${src}" download="page-${i}.${fmt}" class="btn btn-primary" style="font-size:.75rem;padding:6px 12px">${I.download} Page ${i}</a></div></div>`;
      }
      out.innerHTML = status('success',`${pdf.numPages} page(s) converted.`) + html + '</div>';
    } catch(e) { out.innerHTML = status('error', `Error: ${e.message}`); }
  });
}

/* ── Compress ── */
function initCompress() {
  dropZone('dz','pdfFile',false, async files => {
    const file = files[0]; if (!file) return;
    showChosen('dz', files);
    const out = document.getElementById('output');
    out.innerHTML = spinner('Compressing…');
    try {
      const doc   = await PDFLib.PDFDocument.load(await file.arrayBuffer());
      const bytes = await doc.save({ useObjectStreams: true });
      const blob  = new Blob([bytes], { type:'application/pdf' });
      const url   = URL.createObjectURL(blob);
      const orig  = (file.size/1024).toFixed(1);
      const comp  = (blob.size/1024).toFixed(1);
      const pct   = ((1 - blob.size/file.size)*100).toFixed(1);
      out.innerHTML = status('success',`${orig} KB → <strong>${comp} KB</strong> — saved ${pct}%`)
        + `<div class="btn-row">${dlBtn(url,'compressed.pdf','Download Compressed PDF')}</div>`;
    } catch(e) { out.innerHTML = status('error', `Error: ${e.message}`); }
  });
}

/* ── Merge ── */
function initMerge() {
  const mergeBtn = document.getElementById('mergeBtn');
  dropZone('dz','pdfFiles',true, files => {
    _pdfFiles = Array.from(files);
    showChosen('dz', files);
    const fl = document.getElementById('fileList');
    if (_pdfFiles.length < 2) { fl.innerHTML = status('error','Please select at least 2 PDF files.'); mergeBtn.style.display='none'; return; }
    fl.innerHTML = `<div class="file-list">${_pdfFiles.map((f,i)=>`<div class="file-item">${I.file}<span class="file-num">${i+1}</span>${f.name}</div>`).join('')}</div>`;
    mergeBtn.style.display = 'inline-flex';
  });
  mergeBtn.addEventListener('click', async () => {
    const out = document.getElementById('output');
    out.innerHTML = spinner('Merging PDFs…');
    try {
      const merged = await PDFLib.PDFDocument.create();
      for (const f of _pdfFiles) {
        const src   = await PDFLib.PDFDocument.load(await f.arrayBuffer());
        const pages = await merged.copyPages(src, src.getPageIndices());
        pages.forEach(p => merged.addPage(p));
      }
      const blob = new Blob([await merged.save()], { type:'application/pdf' });
      const url  = URL.createObjectURL(blob);
      out.innerHTML = status('success',`Merged ${_pdfFiles.length} PDFs successfully.`)
        + `<div class="btn-row">${dlBtn(url,'merged.pdf','Download Merged PDF')}</div>`;
    } catch(e) { out.innerHTML = status('error', `Error: ${e.message}`); }
  });
}

/* ── Split ── */
function initSplit() {
  const sel     = document.getElementById('pageSelector');
  const pl      = document.getElementById('pageList');
  const exBtn   = document.getElementById('extractBtn');

  dropZone('dz','pdfFile',false, async files => {
    const file = files[0]; if (!file) return;
    showChosen('dz', files);
    try {
      _splitDoc = await PDFLib.PDFDocument.load(await file.arrayBuffer());
      const n = _splitDoc.getPageCount();
      _selectedPages = [];
      pl.innerHTML = Array.from({length:n},(_,i)=>`<button class="page-btn" data-i="${i}">${i+1}</button>`).join('');
      pl.querySelectorAll('.page-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = parseInt(btn.dataset.i);
          if (_selectedPages.includes(i)) { _selectedPages = _selectedPages.filter(p=>p!==i); btn.classList.remove('selected'); }
          else { _selectedPages.push(i); btn.classList.add('selected'); }
        });
      });
      sel.style.display = 'block';
    } catch(e) { document.getElementById('output').innerHTML = status('error',`Error: ${e.message}`); }
  });

  exBtn.addEventListener('click', async () => {
    if (!_selectedPages.length) { alert('Select at least one page.'); return; }
    const out = document.getElementById('output');
    out.innerHTML = spinner('Extracting pages…');
    try {
      const np    = await PDFLib.PDFDocument.create();
      const pages = await np.copyPages(_splitDoc, _selectedPages);
      pages.forEach(p => np.addPage(p));
      const blob = new Blob([await np.save()], { type:'application/pdf' });
      const url  = URL.createObjectURL(blob);
      out.innerHTML = status('success',`Extracted ${_selectedPages.length} page(s).`)
        + `<div class="btn-row">${dlBtn(url,'extracted.pdf','Download Extracted PDF')}</div>`;
    } catch(e) { out.innerHTML = status('error',`Error: ${e.message}`); }
  });
}

/* ── Rotate ── */
function initRotate() {
  dropZone('dz','pdfFile',false, files => { _rotateFile = files[0]; showChosen('dz', files); });
  document.getElementById('rotateBtn').addEventListener('click', async () => {
    if (!_rotateFile) { alert('Please select a PDF first.'); return; }
    const out = document.getElementById('output');
    out.innerHTML = spinner('Rotating pages…');
    try {
      const deg = parseInt(document.getElementById('rotation').value);
      const doc = await PDFLib.PDFDocument.load(await _rotateFile.arrayBuffer());
      doc.getPages().forEach(p => p.setRotation(PDFLib.degrees(deg)));
      const blob = new Blob([await doc.save()], { type:'application/pdf' });
      const url  = URL.createObjectURL(blob);
      out.innerHTML = status('success',`All pages rotated ${deg}°.`)
        + `<div class="btn-row">${dlBtn(url,'rotated.pdf','Download Rotated PDF')}</div>`;
    } catch(e) { out.innerHTML = status('error',`Error: ${e.message}`); }
  });
}

/* ── Info ── */
function initInfo() {
  dropZone('dz','pdfFile',false, async files => {
    const file = files[0]; if (!file) return;
    showChosen('dz', files);
    const out = document.getElementById('output');
    out.innerHTML = spinner('Reading metadata…');
    try {
      const doc  = await PDFLib.PDFDocument.load(await file.arrayBuffer());

          ${row('File Size', (file.size/1024).toFixed(1)+' KB')}
          ${row('Pages', doc.getPageCount())}
          ${row('Page Size', `${Math.round(width)} × ${Math.round(height)} pt`)}
          ${row('Title',   doc.getTitle())}
          ${row('Author',  doc.getAuthor())}
          ${row('Subject', doc.getSubject())}
          ${row('Creator', doc.getCreator())}
        </dl>`;
    } catch(e) { out.innerHTML = status('error',`Error: ${e.message}`); }
  });
}

/* ══════════════════════════════════════════════════
   OCR ENGINE
   Preprocessing approach inspired by Sofwath/thaanaOCR
   (github.com/Sofwath/thaanaOCR) — adapted for the
   browser using Tesseract.js instead of Keras/GRU.
   ══════════════════════════════════════════════════ */

/* ── File type helpers ── */
function isImageFile(f) {
  return /^image\//i.test(f.type) || /\.(png|jpe?g|webp|bmp|tif{1,2})$/i.test(f.name);
}
function isPdfFile(f) {
  return f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
}

/* ── RTL language detection ── */
const RTL_LANGS = ['div','ara','heb','fas','urd'];
function isRtl(lang) {
  return RTL_LANGS.some(l => lang === l || lang.startsWith(l+'+') || lang.endsWith('+'+l));
}

/* ── Image file → canvas ──
   Uses createImageBitmap (modern, no flicker) with <img> fallback.
   Mirrors thaanaOCR's image loading step. ── */
async function imgToCanvas(file, scale) {
  let bmp = null;
  if ('createImageBitmap' in window) {
    try { bmp = await createImageBitmap(file); } catch (_) {}
  }

  let w, h, src;
  if (bmp) {
    w = bmp.width; h = bmp.height; src = bmp;
  } else {
    src = await new Promise((res, rej) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload  = () => { URL.revokeObjectURL(url); res(img); };
      img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Cannot load image. Try PNG or JPG.')); };
      img.src = url;
    });
    w = src.naturalWidth; h = src.naturalHeight;
  }
  if (!w || !h) throw new Error('Image has zero dimensions.');

  // Cap canvas size so mobile browsers don't OOM
  const MAX = 5000;
  const ratio = Math.min(scale, MAX / Math.max(w, h));
  const cw = Math.max(1, Math.round(w * ratio));
  const ch = Math.max(1, Math.round(h * ratio));

  const cv  = document.createElement('canvas');
  cv.width = cw; cv.height = ch;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, cw, ch);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, 0, 0, cw, ch);
  if (bmp && bmp.close) bmp.close();
  return cv;
}

/* ── PDF page → canvas ── */
async function pdfPageToCanvas(page, scale) {
  const vp = page.getViewport({ scale });
  const cv = document.createElement('canvas');
  cv.width  = Math.floor(vp.width);
  cv.height = Math.floor(vp.height);
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, cv.width, cv.height);
  await page.render({ canvasContext: ctx, viewport: vp }).promise;
  return cv;
}

/* ── Preprocessing ──
   Inspired by thaanaOCR's Cairo preprocessing step:
   grayscale → contrast boost → optional binarise → crop.
   The "gentle" mode preserves Thaana fili (vowel marks) better
   than hard thresholding. ── */
function preprocessCanvas(src, mode) {
  if (mode === 'none') return src;

  const ctx = src.getContext('2d', { willReadFrequently: true });
  const id  = ctx.getImageData(0, 0, src.width, src.height);
  const d   = id.data;
  const strong = mode === 'strong';
  // Gentle: contrast 1.3, soft threshold 188
  // Strong: contrast 1.8, hard binarise at 170
  const contrast = strong ? 1.8 : 1.3;
  const thresh   = strong ? 170 : 188;

  for (let i = 0; i < d.length; i += 4) {
    // Weighted luminance (BT.601)
    let g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    // Contrast stretch around mid-grey
    g = (g - 128) * contrast + 128;
    g = Math.max(0, Math.min(255, g));
    if (strong) {
      g = g < thresh ? 0 : 255;
    } else {
      // Soft: keep mid-tones (catches fili marks)
      if (g < thresh - 40) g = 0;
      else if (g > thresh + 40) g = 255;
    }
    d[i] = d[i+1] = d[i+2] = g;
    d[i+3] = 255;
  }
  ctx.putImageData(id, 0, 0);
  return cropWhitespace(src);
}

/* ── Crop near-white borders (thaanaOCR does this too) ── */
function cropWhitespace(src) {
  const ctx = src.getContext('2d', { willReadFrequently: true });
  const { width: w, height: h } = src;
  const px = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y += 2) {
    for (let x = 0; x < w; x += 2) {
      const i = (y * w + x) * 4;
      if (px[i] < 245 || px[i+1] < 245 || px[i+2] < 245) {
        if (x < x0) x0 = x;
        if (y < y0) y0 = y;
        if (x > x1) x1 = x;
        if (y > y1) y1 = y;
      }
    }
  }
  if (x1 < 0 || x0 >= x1 || y0 >= y1) return src;
  const pad = 30;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad);
  x1 = Math.min(w, x1 + pad); y1 = Math.min(h, y1 + pad);
  const out = document.createElement('canvas');
  out.width = x1 - x0; out.height = y1 - y0;
  out.getContext('2d').drawImage(src, x0, y0, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}

/* ── Dhivehi / Thaana post-processing ──
   Removes the systematic noise patterns thaanaOCR's paper identified:
   digit-only garbage lines, broken fili sequences, invisible chars. ── */
function cleanDhivehi(raw) {
  if (!raw) return '';
  let t = String(raw)
    // strip invisible / zero-width chars
    .replace(/[\u200B-\u200F\u202A-\u202E\uFEFF]/g, '')
    // normalise spaces
    .replace(/[\u00A0\u2000-\u200A\u202F\u205F\u3000]/g, ' ')
    // collapse repeated fili / sukun (OCR often doubles them)
    .replace(/([\u07A6-\u07B0ް])\1+/g, '$1')
    // remove space before Dhivehi punctuation
    .replace(/\s+([،؛؟])/g, '$1')
    // collapse runs of spaces / tabs
    .replace(/[ \t]+/g, ' ');

  const lines = t.split('\n').map(l => l.trim()).filter(line => {
    if (!line) return true;
    const thaana = (line.match(/[\u0780-\u07B1]/g) || []).length;
    const fili   = (line.match(/[\u07A6-\u07B0]/g) || []).length;
    const digits = (line.match(/[0-9]/g) || []).length;
    const spaces = (line.match(/\s/g) || []).length;
    // Drop lines that are pure digit noise (paper §4.2)
    if (digits >= 5 && thaana < 3) return false;
    // Drop lines where content is mostly spaces vs. Thaana chars
    if (line.length > 10 && spaces > thaana + fili) return false;
    return true;
  });

  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim();
}

/* ── Generic text clean ── */
function cleanText(raw, lang) {
  let t = String(raw || '');
  if (!t.trim()) return '';
  if (lang === 'eng') {
    return t
      .replace(/[^\x09\x0A\x0D\x20-\x7E]/g, '')
      .replace(/[ \t]+/g, ' ')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }
  if (lang === 'div' || lang.startsWith('div')) {
    // Strip non-Thaana, non-English, non-punctuation chars
    t = t.replace(/[^\u0780-\u07B1\u07A6-\u07B0A-Za-z0-9\s.,،؛؟:;%()\-–—\/]/g, '');
    return cleanDhivehi(t);
  }
  // Other RTL / multi-byte languages: just normalise whitespace
  return t.replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
}

/* ── initOcr ── */
function initOcr() {
  dropZone('dz', 'ocrFile', false, async files => {
    const file = files[0]; if (!file) return;
    showChosen('dz', files);
    if (!isPdfFile(file) && !isImageFile(file)) {
      document.getElementById('output').innerHTML =
        status('error', 'Please choose a PDF or an image file (PNG, JPG, WEBP, BMP).');
      return;
    }
    await runOcr(file);
  });
}

/* ── runOcr — the main pipeline ── */
async function runOcr(file) {
  const out  = document.getElementById('output');
  const lang = document.getElementById('ocrLang').value;
  const scale = parseFloat(document.getElementById('ocrScale').value);
  const prep  = document.getElementById('ocrPrep').value;
  const psm   = document.getElementById('ocrPsm').value;
  const rtl   = isRtl(lang);

  out.innerHTML = `
    <div class="status s-info">
      ${I.warn}
      <div style="flex:1">
        <strong>Running OCR locally…</strong>
        <div class="prog-wrap"><div class="prog-bar" id="ocrBar"></div></div>
        <p class="prog-lbl" id="ocrLog">Preparing…</p>
      </div>
    </div>`;

  const setP = (pct, msg) => {
    const b = document.getElementById('ocrBar');
    const l = document.getElementById('ocrLog');
    if (b) b.style.width = Math.max(0, Math.min(100, pct)) + '%';
    if (l) l.textContent = msg;
  };

  let worker = null;
  try {
    /* 1. Build canvas list from PDF pages or single image */
    const canvases = [];

    if (isPdfFile(file)) {
      setP(3, 'Loading PDF…');
      const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      for (let i = 1; i <= pdf.numPages; i++) {
        setP(3 + (i / pdf.numPages) * 22, `Rendering page ${i} of ${pdf.numPages}…`);
        const page = await pdf.getPage(i);
        const raw  = await pdfPageToCanvas(page, scale);
        canvases.push({ page: i, canvas: preprocessCanvas(raw, prep) });
      }
    } else {
      setP(8, 'Loading image…');
      const raw = await imgToCanvas(file, scale);
      canvases.push({ page: 1, canvas: preprocessCanvas(raw, prep) });
    }

    /* 2. Load Tesseract worker
       Tesseract.js v5 uses its own CDN by default — no langPath needed.
       Multi-language: pass joined string e.g. "div+eng" ── */
    setP(28, 'Loading OCR model… first run may take 30–90 s.');
    worker = await Tesseract.createWorker(lang, 1, {
      logger: m => {
        if (m.status === 'recognizing text' && typeof m.progress === 'number') {
          // fine-grained progress is handled per-page below
        } else if (m.status === 'loading tesseract core') {
          setP(30, 'Loading Tesseract engine…');
        } else if (m.status === 'loading language traineddata') {
          setP(35, `Downloading language model for "${lang}"…`);
        } else if (m.status === 'initializing api') {
          setP(38, 'Initialising OCR…');
        }
      }
    });

    /* 3. Apply Tesseract parameters ── */
    const params = {
      tessedit_pageseg_mode: psm,
      user_defined_dpi: '300',
      preserve_interword_spaces: rtl ? '1' : '0',
    };
    // Thaana character whitelist improves accuracy significantly
    if (lang === 'div') {
      let wl = '';
      for (let cp = 0x0780; cp <= 0x07BF; cp++) wl += String.fromCharCode(cp);
      wl += '0123456789 \n.,،؛؟:;/()\-';
      params.tessedit_char_whitelist = wl;
    }
    await worker.setParameters(params);

    /* 4. OCR each canvas ── */
    const parts = [];
    for (let i = 0; i < canvases.length; i++) {
      const item = canvases[i];
      const pct  = 40 + (i / canvases.length) * 55;
      setP(pct, `Recognising text — page ${item.page} of ${canvases.length}…`);

      const { data: { text } } = await worker.recognize(item.canvas);
      const cleaned = cleanText(text, lang);
      if (cleaned) {
        parts.push(canvases.length > 1 ? `[Page ${item.page}]\n${cleaned}` : cleaned);
      }

      // Free canvas memory immediately
      item.canvas.width = 1; item.canvas.height = 1;
    }

    await worker.terminate();
    worker = null;
    setP(100, 'Done!');

    /* 5. Render result ── */
    const full  = parts.join('\n\n' + '─'.repeat(40) + '\n\n');
    const words = full.split(/\s+/).filter(Boolean).length;
    const chars = full.length;

    window._ocrText     = full;
    window._ocrFilename = file.name.replace(/\.[^.]+$/i, '') + '_ocr.txt';

    out.innerHTML = `
      ${status('success', `OCR complete — ${canvases.length} page(s) · ${words.toLocaleString()} words · ${chars.toLocaleString()} chars`)}
      <textarea class="ocr-box" id="ocrText" spellcheck="false"
        dir="${rtl ? 'rtl' : 'ltr'}"
        style="text-align:${rtl ? 'right' : 'left'}"
      >${esc(full)}</textarea>
      <div class="btn-row">
        <button class="btn btn-success" onclick="dlOcr()">${I.download} Download .txt</button>
        <button class="btn btn-ghost"   onclick="cpOcr(this)">${I.copy} Copy to Clipboard</button>
      </div>`;

  } catch (err) {
    if (worker) { try { await worker.terminate(); } catch (_) {} }
    out.innerHTML = status('error', `OCR failed: ${err.message || String(err)}`);
    console.error('[OCR]', err);
  }
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function dlOcr() {
  const t = document.getElementById('ocrText')?.value || window._ocrText || '';
  const a = document.createElement('a');
  a.href     = URL.createObjectURL(new Blob([t], { type: 'text/plain;charset=utf-8' }));
  a.download = window._ocrFilename || 'ocr_output.txt';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

async function cpOcr(btn) {
  const t = document.getElementById('ocrText')?.value || '';
  try {
    await navigator.clipboard.writeText(t);
    const orig = btn.innerHTML;
    btn.innerHTML = I.check + ' Copied!';
    setTimeout(() => btn.innerHTML = orig, 2200);
  } catch { alert('Copy failed — please select the text and copy manually.'); }
}
</script>
</body>
